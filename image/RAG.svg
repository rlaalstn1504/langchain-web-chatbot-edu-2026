<text x="368.0" y="599" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">질문 임베딩</text>
<text x="368.0" y="627" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">질문도 벡터로 변환</text>
<rect x="800" y="204" width="190" height="112" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
<circle cx="828" cy="232" r="15" fill="#D97706"/>
<text x="828" y="237" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="895.0" y="269" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">관련 조각 검색</text>
<text x="895.0" y="297" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">질문과 가까운 Top-k</text>
<rect x="800" y="364" width="190" height="112" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
<circle cx="828" cy="392" r="15" fill="#D97706"/>
<text x="828" y="397" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="895.0" y="429" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">프롬프트 구성</text>
<text x="895.0" y="457" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">질문 + 근거 문서</text>
<rect x="1018" y="364" width="134" height="112" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
<circle cx="1046" cy="392" r="15" fill="#BE185D"/>
<text x="1046" y="397" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="1085.0" y="429" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">LLM 생성</text>
<text x="1085.0" y="457" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">문맥을 보고 답변</text>
<rect x="1018" y="534" width="134" height="112" rx="16" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
<circle cx="1046" cy="562" r="15" fill="#BE185D"/>
<text x="1046" y="567" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="1085.0" y="599" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">최종 답변</text>
<text x="1085.0" y="627" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">근거 기반 응답</text>
