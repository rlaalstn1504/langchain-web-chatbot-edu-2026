<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">RAG 처리 흐름</title>
<desc id="desc">문서를 청크로 나누고 임베딩해 벡터 DB에 저장한 뒤, 사용자 질문과 관련 조각을 함께 LLM에 전달해 최종 답변을 만드는 흐름도</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CBD5E1" flood-opacity="0.28"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/>
  </marker>
  <style>
    text { font-family: 'Noto Sans CJK KR', 'Noto Sans KR', 'Pretendard', sans-serif; dominant-baseline: alphabetic; }
    .panel { filter: url(#shadow); }
  </style>
</defs>
<rect width="1200" height="760" fill="#F7FAFC"/>
<rect class="panel" x="34" y="34" width="1132" height="692" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="72" y="95" font-size="34" font-weight="700" fill="#0F172A" text-anchor="start">RAG 처리 흐름</text>
<text x="72" y="132" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">문서를 찾아 질문과 함께 넣으면, LLM이 근거 기반으로 답합니다.</text>
<rect x="893" y="72" width="248" height="42" rx="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="1017" y="99" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">Retrieval + Generation</text>
<rect x="72" y="156" width="116" height="34" rx="17" fill="#ECFDF5" stroke="#0F766E" stroke-width="1"/>
<text x="130" y="179" font-size="16" font-weight="700" fill="#0F766E" text-anchor="middle">사전 준비</text>
<rect x="72" y="486" width="116" height="34" rx="17" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="130" y="509" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">질의 처리</text>
<line x1="72" y1="348" x2="1128" y2="348" stroke="#E2E8F0"/>
<line x1="244" y1="260" x2="282" y2="260" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="454" y1="260" x2="492" y2="260" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="578" y1="316" x2="620" y2="334" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="244" y1="590" x2="282" y2="590" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="454" y1="590" x2="536" y2="432" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="728" y1="382" x2="800" y2="260" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="895" y1="316" x2="895" y2="364" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="990" y1="420" x2="1018" y2="420" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1085" y1="476" x2="1085" y2="534" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="72" y="204" width="172" height="112" rx="16" fill="#ECFDF5" stroke="#99F6E4" stroke-width="1.2"/>
<circle cx="100" cy="232" r="15" fill="#0F766E"/>
<text x="100" y="237" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="158.0" y="269" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">문서 수집</text>
<text x="158.0" y="297" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">표준서·보고서·매뉴얼</text>
