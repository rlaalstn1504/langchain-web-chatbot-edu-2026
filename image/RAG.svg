<text x="158.0" y="599" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">사용자 질문</text>
<text x="158.0" y="627" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">예: 예열 조건은?</text>
