<text x="368.0" y="269" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">청크 분할</text>
<text x="368.0" y="297" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">의미 단위로 자르기</text>
<rect x="492" y="204" width="172" height="112" rx="16" fill="#ECFDF5" stroke="#99F6E4" stroke-width="1.2"/>
<circle cx="520" cy="232" r="15" fill="#0F766E"/>
<text x="520" y="237" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="578.0" y="269" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">문서 임베딩</text>
<text x="578.0" y="297" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">조각을 벡터로 변환</text>
<rect x="72" y="534" width="172" height="112" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
<circle cx="100" cy="562" r="15" fill="#2563EB"/>
